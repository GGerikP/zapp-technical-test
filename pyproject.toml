[tool.poetry]
name = "retail-simulator"
version = "0.1.0"
description = ""
authors = ["Gerik Peterson <GGerikP1@Gmail.com>"]
readme = "README.md"

packages = [{include = "retail_simulator", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pydantic = ">=2.11.3,<3.0.0"
pandas = ">=2.2.3,<3.0.0"

[tool.poetry.scripts]
retail-simulator = "retail_simulator.__main__:run"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
